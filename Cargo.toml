[package]
name = "aim_trainer"
version = "1.0.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["bevy_feathers", "wav", "system_clipboard"] }
base64 = "0.23"
discord-rich-presence = "1.1"
fastrand = "2"
# Decodes the embedded window icon; the same version Bevy already builds.
image = { version = "0.25", default-features = false, features = ["png"] }
# Compresses replays (zlib); the same version png's flate2 already builds.
miniz_oxide = "0.9"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
# Window/taskbar icon type; the same version Bevy's windowing uses.
winit = { version = "0.30", default-features = false }

[build-dependencies]
# Embeds the .exe icon.
winresource = "0.1"

# Fast iteration: optimize dependencies (bevy) even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Shipped builds: whole-program optimisation, no debug symbols in the exe.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
