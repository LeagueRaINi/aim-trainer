[package]
name = "aim_trainer"
version = "1.1.1"
edition = "2024"
# `src/bin/release.rs` is the maintainer's release tool, not part of the game:
# `cargo run --bin release --features release-tool -- vX.Y.Z` (see ARCHITECTURE.md, Releases).
default-run = "aim_trainer"

[dependencies]
bevy = { version = "0.20.1", features = ["bevy_feathers", "wav", "system_clipboard"] }
base64 = "0.23"
discord-rich-presence = "1.1"
# Verifies the release key's signature on downloaded updates (and signs them in the release tool).
ed25519-dalek = { version = "3", default-features = false }
fastrand = "2"
# Decodes the embedded window icon; the same version Bevy already builds.
image = { version = "0.25", default-features = false, features = ["png"] }
# Compresses replays (zlib); the same version png's flate2 already builds.
miniz_oxide = "0.9"
ron = "0.12"
# Unpacks downloaded updates (releases ship the exe zstd-compressed).
ruzstd = "0.9"
# Compares release versions; the same version the dependency tree already builds.
semver = "1"
serde = { version = "1", features = ["derive"] }
# GitHub's release JSON; the same version the dependency tree already builds.
serde_json = "1"
# Verifies downloaded updates against the digest GitHub publishes.
sha2 = "0.11"
# The local time zone's offset, for the weekly plan's calendar days.
time = { version = "0.3", default-features = false, features = ["local-offset"] }
# Fetches updates from GitHub releases.
ureq = { version = "3.5", features = ["json"] }
# Window/taskbar icon type; the same version Bevy's windowing uses.
winit = { version = "0.30", default-features = false }
# Packs the release exe (release tool only: it builds zstd's C library).
zstd = { version = "0.13", optional = true }

[build-dependencies]
# Embeds the .exe icon.
winresource = "0.1"

# Fast iteration: optimize dependencies (bevy) even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Shipped builds: whole-program optimisation, no debug symbols in the exe.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
release-tool = ["dep:zstd"]

[[bin]]
name = "release"
path = "src/bin/release.rs"
required-features = ["release-tool"]
