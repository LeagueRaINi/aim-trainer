<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Aim Trainer app icon, detailed variant (64 px and up; logo_small.svg is the 16-48 px variant).
       A monogram: an A without a crossbar. Its apex is a chevron sight, the dot between the legs is the
       point of aim. Ink on a white tile; the neutral rim keeps the tile visible on white and light backgrounds.
       Drawn on a 16-unit grid, so the tile, the rim, the baseline and the feet land on whole pixels at 64, 128
       and 256 px. The legs rise 2 for every 1 across and are 176 wide measured along the baseline.
       Colours: ink is INK_0 of src/ui/theme.rs; the dot is the accent #4CC9F0 at the same hue, darkened
       until it holds 3:1 against white. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBEEF4"/>
    </linearGradient>
  </defs>

  <!-- tile and rim -->
  <rect x="16" y="16" width="992" height="992" rx="224" fill="url(#tile)"/>
  <rect x="24" y="24" width="976" height="976" rx="216" fill="none" stroke="#C3CAD6" stroke-width="16"/>

  <!-- the A -->
  <path d="M512 112L896 880H720L512 464L304 880H128Z" fill="#0B0E13"/>

  <!-- point of aim -->
  <circle cx="512" cy="752" r="96" fill="#0D9DC9"/>
</svg>
